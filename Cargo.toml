[package]
name = "atlas-reseau"
version = "0.2.1"
edition = "2024"
description = "Windows network monitor with a world map, local history and reputation alerts"
license = "MIT"
repository = "https://github.com/dandyArise/Atlas"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }
ipnet = "2"

[profile.release]
strip = true
lto = "thin"

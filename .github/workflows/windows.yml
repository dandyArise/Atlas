name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust MSVC
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Public source hygiene
        run: python scripts/check-public.py
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Release build
        run: cargo build --release --locked
      - name: Local API integration tests
        run: python verify.py target/release/atlas-reseau.exe
      - name: Package portable executable and notices
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Atlas-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'dandyArise/Atlas'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Atlas-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows x64 portable build / Version portable Windows x64.

          Extract the ZIP and run Start-Atlas.cmd. For UDP, stop Atlas and use Start-Atlas-UDP.cmd (UAC).
          Extrayez le ZIP et lancez Start-Atlas.cmd. Pour l'UDP, arretez Atlas puis utilisez Start-Atlas-UDP.cmd (UAC).

          English and French READMEs and third-party notices are included. Compare the ZIP with SHA256SUMS.txt.
          Executable is unsigned. Observation only; UDP/443 means QUIC possible, not confirmed QUIC.
          EOF
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Atlas $TAG" --notes-file release-notes.md
